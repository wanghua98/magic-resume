<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The public renderer falls back to an Arial-compatible Latin font while
       Chinese glyphs come from Noto. Keep that split for the default resume
       font, whose browser-facing family name is Alibaba PuHuiTi. -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Alibaba PuHuiTi</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Liberation Sans</string>
    </edit>
  </match>
</fontconfig>
